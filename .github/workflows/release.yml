name: Release macOS DMG & Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag versi rilis (contoh: v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  run-tests:
    name: Lint, Unit Tests & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Check, Unit & Golden Audio Tests, and Web Build
        run: |
          npm run lint
          npm test
          npm run build

  build-macos:
    name: Build Universal OPUNG-Installer.dmg (macOS)
    needs: [run-tests]
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export OPUNG.app Bundle & Finder Staging
        run: node --import tsx scripts/export-macos-app.mjs dmg_stage

      - name: Compile Universal Objective-C Host (arm64 + x86_64) & Ad-hoc Sign
        run: |
          clang -O2 -fobjc-arc -arch arm64 -arch x86_64 \
            -mmacosx-version-min=11.0 \
            -framework Cocoa -framework WebKit -framework AVFoundation -framework CoreAudio -framework AudioToolbox \
            dmg_stage/OPUNG.app/Contents/Resources/app/native_host.m \
            -o dmg_stage/OPUNG.app/Contents/MacOS/RNNoiseStudioNativeV17
          chmod +x dmg_stage/OPUNG.app/Contents/MacOS/RNNoiseStudioNativeV17
          ln -s /Applications dmg_stage/Applications
          codesign --force --deep --entitlements opung-entitlements.plist --sign - dmg_stage/OPUNG.app
          rm -f opung-entitlements.plist

      - name: Create Compressed UDZO OPUNG-Installer.dmg
        run: |
          hdiutil create -volname "OPUNG Installer" -srcfolder dmg_stage -ov -format UDZO OPUNG-Installer.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: OPUNG-Installer.dmg

  build-windows:
    name: Build Opung-Windows-x64.exe (Windows)
    needs: [run-tests]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows Resources (index.html & AppIcon.ico)
        run: npx tsx scripts/prepare-windows-assets.mjs

      - name: Publish Single-File Windows .exe
        run: |
          dotnet publish windows/Opung.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release-win
          Copy-Item "release-win/Opung.exe" "Opung-Windows-x64.exe" -Force

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Opung-Windows-x64.exe

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Opung - Office Proximity Ultra Noise Gate (${{ inputs.tag || github.ref_name }})"
          generate_release_notes: false
          body: |
            ## Opung — Office Proximity Ultra Noise Gate (${{ inputs.tag || github.ref_name }})

            Aplikasi peredam bising jarak dekat (**radius ≤ 1.0 meter**), pre-compiled **Universal macOS (Apple Silicon & Intel)** + **AudioWorklet RNNoise 0.2 WASM**, dan penjernih vokal **48 kHz Studio HD** untuk **macOS** & **Windows** (Google Meet, Zoom, Microsoft Teams).

            ### Cara Pasang di macOS
            1. Unduh **`OPUNG-Installer.dmg`** di bagian **Assets** di bawah.
            2. Klik 2x file `OPUNG-Installer.dmg`, lalu **geser `OPUNG.app` ke folder `Applications`**.
            3. Buka folder **Applications**, lalu **Klik Kanan (2 jari) → Open** pada `OPUNG.app`.
            4. Pilih **`BlackHole 2ch`** sebagai mikrofon di Google Meet / Zoom.

            ### Cara Pasang di Windows 10 / 11
            1. Pasang driver virtual mic gratis **[VB-Audio Virtual Cable (VB-CABLE)](https://vb-audio.com/Cable/)** lalu restart PC bila diminta.
            2. Unduh dan jalankan **`Opung-Windows-x64.exe`** (langsung berjalan dengan ikon Opung di System Tray).
            3. Pilih **`CABLE Output (VB-Audio Virtual Cable)`** sebagai mikrofon di Google Meet / Zoom.

            ---
            © 2026 Opung · Made with ♥ by **Muhammad Zen**
          files: |
            dist-release/OPUNG-Installer.dmg
            dist-release/Opung-Windows-x64.exe
