name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag versi rilis (contoh: v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish OPUNG-Installer.dmg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript & Build Web App
        run: |
          npm run lint
          npm run build

      - name: Build OPUNG-Installer.dmg
        run: npx tsx scripts/build-dmg.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Opung - Office Proximity Ultra Noise Gate (${{ inputs.tag || github.ref_name }})"
          generate_release_notes: false
          body: |
            ## Opung — Office Proximity Ultra Noise Gate (${{ inputs.tag || github.ref_name }})

            Aplikasi peredam bising jarak dekat (**radius ≤ 1.0 meter**) dan penjernih vokal **48 kHz Studio HD** untuk **macOS**, **Google Meet**, dan **Zoom**.

            ### Cara Pasang di macOS
            1. Unduh **`OPUNG-Installer.dmg`** di bagian **Assets** di bawah.
            2. Klik 2x file `OPUNG-Installer.dmg`, lalu **geser `Opung.app` ke folder `Applications`**.
            3. Buka folder **Applications**, lalu **Klik Kanan (2 jari) → Open** pada `Opung.app`.
            4. Pilih **`BlackHole 2ch`** sebagai mikrofon di Google Meet / Zoom.

            ---
            © 2026 Opung · Made with ♥ by **Muhammad Zen**
          files: |
            OPUNG-Installer.dmg
